# .github/workflows/meteor.yml
# Place this at: .github/workflows/meteor.yml in your Kavisanah profile repo

name: Generate Meteor Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate snake (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/meteor.svg?palette=github-dark&color_snake=a78bfa&color_dots=#1a1b27,#302b63,#6d28d9,#a78bfa,#c4b5fd
            dist/meteor-light.svg?color_snake=7c3aed&color_dots=#eef2ff,#c4b5fd,#a78bfa,#7c3aed,#4c1d95

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
